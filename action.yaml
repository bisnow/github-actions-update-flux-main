name: 'Force-update flux-main branch'
description: 'Updates flux-main branch to match the current branch if conditions are met'
inputs:
  build-container:
    description: 'Whether container was built (true/false)'
    required: true
  k8s-changed:
    description: 'Whether k8s files changed (true/false)'
    required: true
  update-image-tag-result:
    description: 'Result of update-image-tag job (success/failure)'
    required: true
  branch-name:
    description: 'Branch name to push to flux-main (defaults to github.ref_name)'
    required: false
    default: ''
  environment:
    description: 'Deployment environment (e.g. prod, non-prod). Non-prod environments will preserve .k8s/prod from flux-main.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Decide if we should update flux-main
      id: should_run
      shell: bash
      run: |
        echo "build_container=${{ inputs.build-container }}"
        echo "k8s_changed=${{ inputs.k8s-changed }}"
        echo "update_image_tag_result=${{ inputs.update-image-tag-result }}"
        if {
          [ "${{ inputs.build-container }}" = "true" ] && [ "${{ inputs.update-image-tag-result }}" = "success" ]
        } || {
          [ "${{ inputs.build-container }}" = "false" ] && [ "${{ inputs.k8s-changed }}" = "true" ]
        }; then
          echo "run_flux=true" >> $GITHUB_ENV
        else
          echo "run_flux=false" >> $GITHUB_ENV
        fi

    - name: Checkout Repository
      if: env.run_flux == 'true'
      uses: actions/checkout@v6

    - name: Ensure local branch is up to date with remote
      if: env.run_flux == 'true'
      shell: bash
      run: |
        git fetch origin
        branch_name="${{ inputs.branch-name }}"
        if [ -z "$branch_name" ]; then
          # Check if ref is a tag, if so use main branch
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            branch_name="main"
          else
            branch_name="${{ github.ref_name }}"
          fi
        fi
        git checkout "$branch_name"
        git reset --hard "origin/$branch_name"

    # Record the flux-main commit this run builds on. The push below is leased
    # to it, so a flux-main commit made after this point is never overwritten.
    # Only "no such branch" (ls-remote exit 2) counts as a missing flux-main;
    # any other failure stops the run, so a failed read can't skip the
    # .k8s/prod restore below.
    - name: Read current flux-main
      id: flux_main
      if: env.run_flux == 'true'
      shell: bash
      run: |
        rc=0
        git ls-remote --exit-code origin refs/heads/flux-main > /dev/null || rc=$?
        case "$rc" in
          0)
            git fetch --no-tags origin +refs/heads/flux-main:refs/remotes/origin/flux-main
            echo "sha=$(git rev-parse refs/remotes/origin/flux-main)" >> "$GITHUB_OUTPUT"
            ;;
          2)
            echo "flux-main does not exist yet; it will be created."
            echo "sha=" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::Could not read flux-main from origin (git ls-remote exit $rc). flux-main will not be updated."
            exit 1
            ;;
        esac

    - name: Restore .k8s/prod from flux-main (non-prod environments)
      id: restore_prod
      if: env.run_flux == 'true' && inputs.environment != 'prod'
      shell: bash
      env:
        FLUX_SHA: ${{ steps.flux_main.outputs.sha }}
      run: |
        if [ -n "$FLUX_SHA" ] && git ls-tree -d "$FLUX_SHA" -- .k8s/prod | grep -q .; then
          # Replace .k8s/prod wholesale, so files that exist only on this
          # branch never reach flux-main either.
          git rm -r -q --ignore-unmatch -- .k8s/prod
          git checkout "$FLUX_SHA" -- .k8s/prod || {
            echo "::error::Failed to restore .k8s/prod from flux-main. flux-main will not be updated."
            exit 1
          }
        fi
        if ! git diff --cached --quiet; then
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "chore: preserve .k8s/prod from flux-main [skip ci]" || {
            echo "::error::Failed to commit .k8s/prod restoration from flux-main. flux-main will not be updated."
            exit 1
          }
        fi

    - name: Force-update flux-main to match branch
      if: env.run_flux == 'true' && steps.flux_main.outcome == 'success' && (steps.restore_prod.outcome == 'success' || steps.restore_prod.outcome == 'skipped')
      shell: bash
      env:
        FLUX_SHA: ${{ steps.flux_main.outputs.sha }}
      run: |
        # An empty FLUX_SHA leases on "flux-main must not exist yet".
        git push origin "HEAD:refs/heads/flux-main" --force-with-lease="refs/heads/flux-main:$FLUX_SHA"
